<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
</head>
<body>

    <form id="formKhuyenMai">
        <table border="1" bordercolor="#006699" cellpadding="5" cellspacing="0" align="center" style="border-collapse: collapse; width: 500px;">
            <!-- Tiêu đề -->
            <tr bgcolor="#006699">
                <td colspan="2" align="center" style="color: #FFFFFF; font-weight: bold; font-size: 16px;">
                    Phiếu đăng ký tham gia chương trình khuyến mãi
                </td>
            </tr>

            <!-- Họ và tên -->
            <tr>
                <td>Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="30" value="Nguyễn Ngọc Quỳnh Nga"></td>
            </tr>

            <!-- Địa chỉ -->
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="40" value="2Bia Hùng Vương, Q10"></td>
            </tr>

            <!-- Điện thoại -->
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="20" value="0909097506"></td>
            </tr>

            <!-- Phái (Radio Buttons) -->
            <tr>
                <td>Phái</td>
                <td>
                    <input type="radio" name="rdPhai" id="rdNam" value="Nam"> Nam
                    <input type="radio" name="rdPhai" id="rdNu" value="Nữ" checked> Nữ
                </td>
            </tr>

            <!-- Nghề nghiệp (Dropdown-box đơn) -->
            <tr>
                <td>Nghề nghiệp</td>
                <td>
                    <select id="cboNgheNghiep">
                        <option value="Bác sĩ">Bác sĩ</option>
                        <option value="Kỹ sư">Kỹ sư</option>
                        <option value="Giáo viên" selected>Giáo viên</option>
                        <option value="Khác">Khác</option>
                    </select>
                </td>
            </tr>

            <!-- Chọn sản phẩm tham gia (Dropdown-box nhiều danh mục) -->
            <tr>
                <td>Chọn sản phẩm tham gia</td>
                <td>
                    <select id="lstSanPham" size="4" multiple style="width: 150px;">
                        <option value="Kem đánh răng" selected>Kem đánh răng</option>
                        <option value="Bột giặt" selected>Bột giặt</option>
                        <option value="Dầu gội đầu" selected>Dầu gội đầu</option>
                        <option value="Sữa tắm" selected>Sữa tắm</option>
                    </select>
                </td>
            </tr>

            <!-- Số người dự đoán tham gia -->
            <tr>
                <td>Số người dự đoán tham gia</td>
                <td><input type="text" id="txtDuDoan" size="15" value="250000"></td>
            </tr>

            <!-- Nút Đồng ý -->
            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDangKy()">
                </td>
            </tr>

            <!-- Ô thông báo -->
            <tr>
                <td colspan="2" align="center">
                    <div id="lblThongBao" style="color: #FF0000; font-weight: bold;"></div>
                </td>
            </tr>
        </table>
    </form>

    <!-- Xử lý chức năng -->
    <script>
        function xuLyDangKy() {
            // Hiển thị câu thông báo ra điều khiển nhãn div theo yêu cầu
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>

</body>
</html>
