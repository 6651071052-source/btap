<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
</head>
<body>

    <form id="formDangKyDuLich">
        <table border="1" bordercolor="#006699" cellpadding="5" cellspacing="0" align="center" style="border-collapse: collapse; width: 550px;">
            <!-- Tiêu đề -->
            <tr bgcolor="#006699">
                <td colspan="2" align="center" style="color: #FFFFFF; font-weight: bold; font-size: 18px;">
                    Đăng ký du lịch
                </td>
            </tr>

            <!-- Họ và tên -->
            <tr>
                <td width="35%">Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="30" value="Phạm Ngọc Cẩm Đào"></td>
            </tr>

            <!-- Địa chỉ -->
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="35" value="1227 Nguyễn Văn Cừ"></td>
            </tr>

            <!-- Điện thoại -->
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="20" value="8351056"></td>
            </tr>

            <!-- Khách Việt Nam (Checkbox) -->
            <tr>
                <td>Khách Việt Nam</td>
                <td><input type="checkbox" id="chkVietNam" checked></td>
            </tr>

            <!-- Chọn tour (OptionGroup - Optgroup) -->
            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="cboTour" style="width: 250px;">
                        <optgroup label="Miền Bắc">
                            <option value="Hà Nội - Hạ Long - Sapa">Hà Nội - Hạ Long - Sapa</option>
                            <option value="Hà Nội - Chùa Hương - Ninh Bình">Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option value="Hà Nội - Cát Bà - Tuần Châu">Hà Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Huế - Bạch Mã - Đà Nẵng">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="Nha Trang - Đà lạt">Nha Trang - Đà lạt</option>
                            <option value="Buôn mê thuột - Gia lai - Kontum" selected>Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="TP.HCM - Cần Thơ - Cà Mau">TP.HCM - Cần Thơ - Cà Mau</option>
                            <option value="TP.HCM - Mỹ Tho">TP.HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>

            <!-- Phương tiện (Radio Buttons) -->
            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" name="rdPhuongTien" id="rdMayBay" value="Máy bay" checked> Máy bay
                    <input type="radio" name="rdPhuongTien" id="rdOTo" value="Xe ô tô"> Xe ô tô
                </td>
            </tr>

            <!-- Số lượng đoàn khách (Fieldset & Legend) -->
            <tr>
                <td>Số lượng đoàn khách</td>
                <td>
                    <fieldset style="border: 1px solid #006699; width: 280px; height: 45px;">
                        <legend align="left" style="font-style: italic; color: #006699;">Số lượng</legend>
                        Người lớn: <input type="text" id="txtNguoiLon" size="3" value="16">
                        Trẻ em: <input type="text" id="txtTreEm" size="3" value="4">
                    </fieldset>
                </td>
            </tr>

            <!-- Ghi chú thêm (Textarea) -->
            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" rows="3" style="width: 300px;">Có 2 trẻ em dưới 6 tuổi&#10;Có 2 người ăn chay</textarea>
                </td>
            </tr>

            <!-- Nút Đồng ý -->
            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDangKy()">
                </td>
            </tr>

            <!-- Ô thông báo -->
            <tr>
                <td colspan="2" align="center">
                    <div id="lblThongBao" style="color: #FF0000; font-weight: bold;"></div>
                </td>
            </tr>
        </table>
    </form>

    <!-- Xử lý chức năng -->
    <script>
        function xuLyDangKy() {
            // Xuất câu thông báo ra thẻ div nhãn
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>

</body>
</html>
